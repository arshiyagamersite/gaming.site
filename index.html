<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Site</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: #1b1b1b;
            padding: 25px;
            text-align: center;
            border-bottom: 2px solid #444;
        }

        header h1 {
            margin: 0;
            font-size: 35px;
        }

        .hero {
            text-align: center;
            padding: 70px 20px;
            background: #181818;
        }

        .hero h2 {
            font-size: 40px;
        }

        .hero p {
            font-size: 18px;
            color: #bbb;
        }

        .videos {
            padding: 30px;
        }

        .videos h2 {
            text-align: center;
        }

        .video-box {
            max-width: 700px;
            margin: 25px auto;
            background: #1d1d1d;
            padding: 20px;
            border-radius: 12px;
        }

        .video-placeholder {
            height: 350px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎮 GAMING SITE</h1>
    </header>

    <section class="hero">
        <h2>به سایت گیمینگ خوش آمدید!</h2>
        <p>ویدیوهای گیمینگ، آموزش‌ها و کلی محتوای جذاب</p>
    </section>

    <section class="videos">
        <h2>🔥 ویدیوهای جدید</h2>

        <div class="video-box">
            <div class="video-placeholder">
    <iframe
        width="100%"
        height="350"
        src="https://www.youtube.com/embed/MmB9b5njVbA?rel=0"
        title="Official Minecraft Trailer"
        frameborder="0"
        allowfullscreen>
    </iframe>
</div>

            <h3>اولین ویدیوی گیمینگ</h3>
            <p>به‌زودی ویدیوی جدید اینجا قرار می‌گیرد.</p>
        </div>
    </section>

</body>
</html>
